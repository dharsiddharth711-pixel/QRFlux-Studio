<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fluxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#fluxGrad)" filter="url(#glow)"/>
  
  <!-- Inner Dark Glass Box -->
  <rect x="15" y="15" width="70" height="70" rx="18" fill="#0a0d14" opacity="0.85"/>
  
  <!-- Glowing QR Matrix Pattern -->
  <!-- Corner Top Left -->
  <rect x="26" y="26" width="20" height="20" rx="5" fill="#ffffff" />
  <rect x="31" y="31" width="10" height="10" rx="2" fill="#6366f1" />
  
  <!-- Corner Top Right -->
  <rect x="54" y="26" width="20" height="20" rx="5" fill="#ffffff" />
  <rect x="59" y="31" width="10" height="10" rx="2" fill="#06b6d4" />
  
  <!-- Corner Bottom Left -->
  <rect x="26" y="54" width="20" height="20" rx="5" fill="#ffffff" />
  <rect x="31" y="59" width="10" height="10" rx="2" fill="#8b5cf6" />
  
  <!-- Flux Spark Matrix Center Dots -->
  <circle cx="62" cy="62" r="5" fill="#06b6d4" />
  <circle cx="72" cy="54" r="4" fill="#ffffff" />
  <circle cx="54" cy="72" r="4" fill="#6366f1" />
</svg>